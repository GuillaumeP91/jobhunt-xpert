<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobHunt Xpert</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-title">
      <div class="brand-row">
        <div class="logo-mark" aria-hidden="true">JX</div>
        <h1>JobHunt Xpert</h1>
      </div>
      <div class="header-meta">
        <div class="stat" id="sentStat">0 applications sent</div>
        <button type="button" id="userGreeting" class="user-greeting">+ Add your name</button>
      </div>
    </div>
    <div class="header-actions">
      <button id="themeToggleBtn" class="icon-btn" title="Toggle dark mode" type="button">🌙</button>
      <button id="addBtn" class="primary-btn">+ New Application</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="searchInput" class="toolbar-input" placeholder="Search by company or role...">
    <select id="tagFilterSelect" class="toolbar-input"></select>
    <label class="toolbar-checkbox" title="Shows applications overdue for a follow-up (10+ days since you applied, still Sent or Interview) or with a deadline in the next 3 days (or already passed).">
      <input type="checkbox" id="attentionCheckbox">
      Needs attention only
    </label>
    <div class="toolbar-spacer"></div>
    <button id="exportJsonBtn" class="ghost-btn small-btn" type="button">Export JSON</button>
    <button id="exportCsvBtn" class="ghost-btn small-btn" type="button">Export CSV</button>
    <button id="importJsonBtn" class="ghost-btn small-btn" type="button">Import JSON</button>
    <input type="file" id="importJsonInput" accept="application/json" class="hidden">
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-tile"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat-tile"><div class="stat-value" id="statSent">0</div><div class="stat-label">Sent</div></div>
    <div class="stat-tile"><div class="stat-value" id="statInterviewRate">0%</div><div class="stat-label">Interview rate</div></div>
    <div class="stat-tile"><div class="stat-value" id="statResponseRate">0%</div><div class="stat-label">Response rate</div></div>
    <div class="stat-tile"><div class="stat-value" id="statOfferRate">0%</div><div class="stat-label">Offer rate</div></div>
  </div>

  <div id="followUpBanner" class="follow-up-banner hidden"></div>

  <div class="board" id="board">
    <div class="column" data-status="to-apply">
      <h2>To Apply <span class="count" id="count-to-apply">0</span></h2>
      <div class="cards" id="cards-to-apply"></div>
    </div>
    <div class="column" data-status="sent">
      <h2>Sent <span class="count" id="count-sent">0</span></h2>
      <div class="cards" id="cards-sent"></div>
    </div>
    <div class="column" data-status="interview">
      <h2>Interview <span class="count" id="count-interview">0</span></h2>
      <div class="cards" id="cards-interview"></div>
    </div>
    <div class="column" data-status="response">
      <h2>Response <span class="count" id="count-response">0</span></h2>
      <div class="cards" id="cards-response"></div>
    </div>
  </div>

  <footer class="quotes-section">
    <div class="quote-card">
      <div class="quote-label">Quote of the Day</div>
      <p class="quote-text" id="quoteText"></p>
    </div>
  </footer>

  <!-- Add/edit modal -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modalTitle">New Application</h2>
      <form id="cardForm">
        <label>Company
          <input type="text" id="fieldCompany" required placeholder="e.g. Acme Corp">
        </label>
        <label>Role
          <input type="text" id="fieldRole" required placeholder="e.g. Frontend Developer">
        </label>
        <label>Job link
          <input type="text" id="fieldLink" placeholder="https://...">
        </label>

        <div class="field-row">
          <label>Applied on
            <input type="date" id="fieldAppliedDate">
          </label>
          <label>Application deadline
            <input type="date" id="fieldDeadline">
          </label>
        </div>

        <label>Salary
          <input type="text" id="fieldSalary" placeholder="e.g. €65,000 - €75,000">
        </label>

        <label>Status
          <select id="fieldStatus">
            <option value="to-apply">To Apply</option>
            <option value="sent">Sent</option>
            <option value="interview">Interview</option>
            <option value="response">Response</option>
          </select>
        </label>
        <label id="outcomeField" class="hidden">Outcome
          <select id="fieldOutcome">
            <option value="pending">Awaiting decision</option>
            <option value="accepted">Accepted</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>

        <div class="tags-field">
          <div class="notes-label">Tags</div>
          <div id="tagsChips" class="tags-chips"></div>
          <div id="tagPresets" class="tag-presets"></div>
          <div class="custom-tag-row">
            <input type="text" id="customTagInput" placeholder="Add a custom tag...">
            <button type="button" id="addCustomTagBtn" class="ghost-btn">Add tag</button>
          </div>
        </div>

        <div id="notesSection" class="notes-section hidden">
          <div class="notes-label">Notes</div>
          <div id="notesList" class="notes-list"></div>
          <div class="add-note-row">
            <textarea id="newNoteText" rows="2" placeholder="Add a note for this stage..."></textarea>
            <button type="button" id="addNoteBtn" class="ghost-btn">Add note</button>
          </div>
        </div>
        <div id="notesHint" class="notes-hint">Save this application first to start adding notes.</div>

        <div class="modal-actions">
          <button type="button" id="deleteBtn" class="danger-btn hidden">Delete</button>
          <div class="spacer"></div>
          <button type="button" id="cancelBtn" class="ghost-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
